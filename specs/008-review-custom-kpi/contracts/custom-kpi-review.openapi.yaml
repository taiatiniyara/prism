openapi: 3.0.3
info:
  title: Custom KPI Review API
  version: 0.1.0
  description: |
    Contract for custom KPI submission, reviewer decisioning, override, and
    visibility promotion.
servers:
  - url: /api
security:
  - sessionAuth: []
paths:
  /data-entry/custom-kpi/requests:
    post:
      summary: Submit a custom KPI request
      tags: [CustomKpiRequests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomKpiRequest"
      responses:
        "201":
          description: Request created in pending review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomKpiRequestResponse"
        "400":
          description: Validation error or duplicate pending request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    get:
      summary: List custom KPI requests (mine or reviewer view)
      tags: [CustomKpiRequests]
      parameters:
        - name: mine
          in: query
          schema:
            type: boolean
            default: true
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RequestStatus"
      responses:
        "200":
          description: Requests listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomKpiRequestResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /data-entry/custom-kpi/requests/{requestId}/decision:
    post:
      summary: Review or override decision for a request (DEV reviewer only)
      tags: [CustomKpiReview]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Decision conflict

  /data-entry/custom-kpi/requests/{requestId}/promotion:
    post:
      summary:
        Promote approved submitter-only KPI to global visibility (DEV reviewer
        only)
      tags: [CustomKpiPromotion]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Visibility promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Request not in promotable state

  /data-entry/custom-kpi/email-retries:
    post:
      summary: Process pending custom KPI review email retries (internal)
      tags: [CustomKpiNotifications]
      responses:
        "200":
          description: Retry batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  processed:
                    type: integer
                  sent:
                    type: integer
                  failedRetryable:
                    type: integer
                  failedFinal:
                    type: integer
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RequestStatus:
      type: string
      enum: [PENDING_REVIEW, APPROVED, REJECTED, REPLACED]

    VisibilityScope:
      type: string
      enum: [SUBMITTER_ONLY, GLOBAL]

    DecisionType:
      type: string
      enum: [APPROVE, REJECT, REPLACE]

    CreateCustomKpiRequest:
      type: object
      required: [title, formulaExpression, businessContext]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        formulaExpression:
          type: string
          minLength: 1
          maxLength: 2000
        businessContext:
          type: string
          minLength: 1
          maxLength: 2000

    ReviewDecisionRequest:
      type: object
      required: [decisionType, rationale]
      properties:
        decisionType:
          $ref: "#/components/schemas/DecisionType"
        rationale:
          type: string
          minLength: 1
          maxLength: 2000
        replacementKpiId:
          type: string
          format: uuid
          nullable: true
        override:
          type: boolean
          default: false
      allOf:
        - if:
            properties:
              decisionType:
                const: REPLACE
          then:
            required: [replacementKpiId]

    CustomKpiRequestResponse:
      type: object
      required:
        [id, status, visibilityScope, submitterUserId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        submitterUserId:
          type: string
        status:
          $ref: "#/components/schemas/RequestStatus"
        visibilityScope:
          $ref: "#/components/schemas/VisibilityScope"
        replacementKpiId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DecisionResponse:
      type: object
      required: [requestId, decisionId, status, visibilityScope, emailQueued]
      properties:
        requestId:
          type: string
          format: uuid
        decisionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RequestStatus"
        visibilityScope:
          $ref: "#/components/schemas/VisibilityScope"
        emailQueued:
          type: boolean

    PromotionResponse:
      type: object
      required: [requestId, visibilityScope]
      properties:
        requestId:
          type: string
          format: uuid
        visibilityScope:
          $ref: "#/components/schemas/VisibilityScope"
