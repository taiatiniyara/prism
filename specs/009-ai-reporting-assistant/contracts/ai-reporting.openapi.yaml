openapi: 3.0.3
info:
  title: PRISM AI Reporting API
  version: 0.1.0
  description: >-
    Contract for AI-assisted reporting queries, exports, and narrative share
    review controls for the AI Reporting Assistant MVP.
servers:
  - url: /api
security:
  - sessionAuth: []
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: prism_session
  schemas:
    QueryRequest:
      type: object
      required: [prompt, queryClass]
      description: >-
        Query class drives context requirements. `reportPeriodId` is required
        for completeness, stale-missing-kpi, and pending-queue classes.
      properties:
        prompt:
          type: string
          minLength: 1
        queryClass:
          type: string
          enum:
            - completeness
            - review-bottlenecks
            - stale-missing-kpi
            - pending-queue
        filterContext:
          type: object
          additionalProperties: false
          properties:
            reportPeriodId:
              type: integer
              minimum: 1
            serviceAreaId:
              type: integer
              minimum: 1
        sessionContextId:
          type: string
          nullable: true
      oneOf:
        - properties:
            queryClass:
              enum: [completeness, stale-missing-kpi, pending-queue]
            filterContext:
              type: object
              required: [reportPeriodId]
        - properties:
            queryClass:
              enum: [review-bottlenecks]
    MetricItem:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
        unit:
          type: string
          nullable: true
    RowItem:
      type: object
      additionalProperties: true
    AttributionItem:
      type: object
      required: [sourceName, sourceType, sourceRef]
      properties:
        sourceName:
          type: string
        sourceType:
          type: string
          enum: [SERVICE_FUNCTION, DATASET]
        sourceRef:
          type: string
    ExportDescriptor:
      type: object
      required: [pdfAvailable, csvAvailable]
      properties:
        pdfAvailable:
          type: boolean
        csvAvailable:
          type: boolean
        reportId:
          type: string
          nullable: true
    QueryResponse:
      type: object
      required: [traceId, summary, metrics, rows, attribution, export]
      properties:
        traceId:
          type: string
        summary:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricItem"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RowItem"
        attribution:
          type: array
          items:
            $ref: "#/components/schemas/AttributionItem"
        export:
          $ref: "#/components/schemas/ExportDescriptor"
        warnings:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [message, traceId]
      properties:
        message:
          type: string
        traceId:
          type: string
        code:
          type: string
          enum:
            - VALIDATION
            - FORBIDDEN
            - TIMEOUT
            - DOWNSTREAM_FAILURE
            - NO_DATA
            - POLICY_BYPASS
    ExportRequest:
      type: object
      required: [traceId, format]
      properties:
        traceId:
          type: string
        format:
          type: string
          enum: [pdf, csv]
    ExportResponse:
      type: object
      required: [traceId, format, fileName, contentType, downloadUrl]
      properties:
        traceId:
          type: string
        format:
          type: string
          enum: [pdf, csv]
        fileName:
          type: string
        contentType:
          type: string
        downloadUrl:
          type: string
    NarrativeShareReviewRequest:
      type: object
      required: [traceId, decision]
      properties:
        traceId:
          type: string
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        rationale:
          type: string
          nullable: true
    NarrativeShareReviewResponse:
      type: object
      required: [traceId, decision, reviewedAt]
      properties:
        traceId:
          type: string
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        reviewedAt:
          type: string
          format: date-time
    TraceListItem:
      type: object
      required:
        [traceId, status, latencyMs, createdAt, retainedUntil, selectedTools]
      properties:
        traceId:
          type: string
        status:
          type: string
          enum:
            - SUCCESS
            - VALIDATION_ERROR
            - FORBIDDEN
            - TIMEOUT
            - PARTIAL_FAILURE
            - NO_DATA
            - POLICY_BYPASS
        failureType:
          type: string
          nullable: true
        latencyMs:
          type: number
        rowCountReturned:
          type: number
        selectedTools:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        retainedUntil:
          type: string
          format: date-time
    TraceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TraceListItem"
paths:
  /ai/query:
    post:
      summary: Run an AI reporting query
      description: >-
        Authenticated endpoint for DEV/BMO/BLO/CEO users. Routes prompt intent
        to existing read-only service functions with role-scoped enforcement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Successful AI response envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden by role/tool authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Query timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/exports:
    post:
      summary: Generate AI report export
      description: >-
        Generates a PDF or CSV export from a previously produced AI trace
        result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Export generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/reports/{reportId}/share:
    post:
      summary: Apply narrative share review decision
      description: >-
        Records a human review decision controlling whether AI-generated
        narratives may be externally shared.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NarrativeShareReviewRequest"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NarrativeShareReviewResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/traces:
    get:
      summary: List AI execution traces for governance review
      description: >-
        Returns AI trace logs for authorized administrators within retention
        window.
      responses:
        "200":
          description: Trace list retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
