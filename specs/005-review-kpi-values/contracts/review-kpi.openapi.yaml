openapi: 3.0.3
info:
  title: Review KPI API
  version: 0.1.0
  description:
    Contracts for review-kpi listing, editing, comments, and sync updates.
servers:
  - url: /api/data-entry/review-kpi
tags:
  - name: review-kpi
  - name: review-kpi-sync
paths:
  /:
    get:
      tags: [review-kpi]
      summary: List KPI rows for active filter context
      parameters:
        - in: query
          name: reportTypeId
          required: true
          schema: { type: integer }
        - in: query
          name: reportPeriodId
          required: true
          schema: { type: integer }
        - in: query
          name: kpiCategoryId
          required: false
          schema: { type: integer, nullable: true }
        - in: query
          name: kpiSubcategoryId
          required: false
          schema: { type: integer, nullable: true }
        - in: query
          name: serviceAreaId
          required: false
          schema: { type: integer, nullable: true }
      responses:
        "200":
          description: KPI rows for the authorized filter context
          content:
            application/json:
              schema:
                type: object
                required: [context, rows]
                properties:
                  context:
                    $ref: "#/components/schemas/ReviewKpiFilterContext"
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewKpiRow"
        "400":
          description: Invalid filter context
        "401":
          description: Unauthorized
  /inputs/{dataEntryId}:
    patch:
      tags: [review-kpi]
      summary: Update one input value with optimistic concurrency
      parameters:
        - in: path
          name: dataEntryId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, updatedAt]
              properties:
                value:
                  type: string
                  nullable: true
                updatedAt:
                  type: string
                  format: date-time
                  description: Client concurrency token from last read.
      responses:
        "200":
          description: Save succeeded and recalculation trigger accepted
          content:
            application/json:
              schema:
                type: object
                required: [input, result]
                properties:
                  input:
                    $ref: "#/components/schemas/ReviewKpiInputValue"
                  result:
                    $ref: "#/components/schemas/ReviewKpiResult"
        "400":
          description: Validation failure
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Concurrency conflict (stale write)
          content:
            application/json:
              schema:
                type: object
                required: [message, latest]
                properties:
                  message:
                    type: string
                  latest:
                    $ref: "#/components/schemas/ReviewKpiInputValue"
  /inputs/{dataEntryId}/comments:
    post:
      tags: [review-kpi]
      summary: Add comment to an input thread
      parameters:
        - in: path
          name: dataEntryId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Comment persisted
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/InputComment"
        "400":
          description: Validation failure
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /events:
    get:
      tags: [review-kpi-sync]
      summary:
        Subscribe to filter-scoped review-kpi sync events (SSE primary, JSON
        catch-up fallback)
      parameters:
        - in: query
          name: reportPeriodId
          required: true
          schema: { type: integer }
        - in: query
          name: serviceAreaId
          required: false
          schema: { type: integer, nullable: true }
        - in: query
          name: kpiCategoryId
          required: false
          schema: { type: integer, nullable: true }
        - in: query
          name: kpiSubcategoryId
          required: false
          schema: { type: integer, nullable: true }
        - in: query
          name: sinceEventId
          required: false
          schema: { type: string }
          description:
            When provided, endpoint returns finite JSON catch-up events from
            this cursor; otherwise it serves live SSE.
      responses:
        "200":
          description:
            Live SSE stream by default; JSON catch-up payload when sinceEventId
            is provided
          content:
            text/event-stream:
              description:
                Continuous live sync stream for authorized viewers in scoped
                filter context
              schema:
                $ref: "#/components/schemas/SyncEventEnvelope"
            application/json:
              description:
                Finite reconnect catch-up event list; client should reopen SSE
                after applying events
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncEventEnvelope"
        "401":
          description: Unauthorized
components:
  schemas:
    ReviewKpiFilterContext:
      type: object
      required: [reportTypeId, reportPeriodId]
      properties:
        reportTypeId: { type: integer }
        reportPeriodId: { type: integer }
        kpiCategoryId: { type: integer, nullable: true }
        kpiSubcategoryId: { type: integer, nullable: true }
        serviceAreaId: { type: integer, nullable: true }
    ReviewKpiRow:
      type: object
      required: [kpiDefId, kpiName, inputs, result]
      properties:
        kpiDefId: { type: integer }
        kpiName: { type: string }
        formulaText: { type: string, nullable: true }
        categoryId: { type: integer, nullable: true }
        subcategoryId: { type: integer, nullable: true }
        reportPeriodId: { type: integer }
        serviceAreaId: { type: integer, nullable: true }
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/ReviewKpiInputValue"
        result:
          $ref: "#/components/schemas/ReviewKpiResult"
    ReviewKpiInputValue:
      type: object
      required: [dataEntryId, inputDefId, inputName, updatedAt]
      properties:
        dataEntryId: { type: string, format: uuid }
        inputDefId: { type: integer }
        inputName: { type: string }
        value: { type: string, nullable: true }
        controlType:
          type: string
          enum: [text, number, boolean, select, date, managedLists, fallback]
        comments:
          type: array
          items:
            $ref: "#/components/schemas/InputComment"
        updatedAt: { type: string, format: date-time }
        updatedById: { type: string, nullable: true }
    ReviewKpiResult:
      type: object
      required: [status]
      properties:
        kpiId: { type: string, format: uuid, nullable: true }
        value: { type: string, nullable: true }
        status:
          type: string
          enum: [calculated, missing-input, stale, error]
        calculatedAt: { type: string, format: date-time, nullable: true }
        formulaVersion: { type: string, nullable: true }
    InputComment:
      type: object
      required: [comment, commenterId, commenterRole, date]
      properties:
        comment: { type: string }
        commenterId: { type: string }
        commenterRole: { type: string }
        date: { type: string, format: date-time }
        resolved: { type: boolean, nullable: true }
        replies:
          type: array
          items:
            $ref: "#/components/schemas/InputComment"
          nullable: true
    SyncEventEnvelope:
      type: object
      required:
        [eventId, eventType, occurredAt, reportPeriodId, kpiDefId, payload]
      properties:
        eventId: { type: string }
        eventType:
          type: string
          enum: [input-updated, comment-added, kpi-recalculated, sync-recovered]
        occurredAt: { type: string, format: date-time }
        reportPeriodId: { type: integer }
        serviceAreaId: { type: integer, nullable: true }
        kpiDefId: { type: integer }
        inputDefId: { type: integer, nullable: true }
        dataEntryId: { type: string, format: uuid, nullable: true }
        payload:
          type: object
          additionalProperties: true
