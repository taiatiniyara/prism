name: "Deploy to VPS"

on:
  push:
    branches: ["main"]
    paths-ignore:
      # Coordination docs / markdown never affect the running app — skip the VPS
      # deploy for docs-only pushes (e.g. PENDING.md / USER-IMPACT.md updates).
      # SQL-only pushes are applied manually per the expand/contract DB rules, so
      # they also skip the VPS. A mixed code push still deploys; the fresh clone
      # on the VPS picks up ALL files (including any skipped docs/SQL from earlier).
      - "docs/**"
      - "**.md"
      # Raw SQL migration/data scripts are applied to p2 MANUALLY (git-first) and are
      # never executed by this deploy — they change no runtime code. Deploying on a
      # SQL-only PR just rebuilds for nothing. Skip them. A mixed code+SQL push
      # still deploys (paths-ignore only skips when EVERY changed file matches).
      - "scripts/sql/**"

# Serialize deploys: only ONE deploy runs at a time. Concurrent deploys race on
# the same /root/prism-app releases dir and would corrupt a release mid-build.
# cancel-in-progress: false so a running deploy is never interrupted mid-install
# (which would itself leave a partial release behind).
concurrency:
  group: deploy-to-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_SHA
          command_timeout: 15m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            APP=/root/prism-app
            REPO=https://github.com/taiatiniyara/prism.git

            # Blue/green zero-dropped-requests deploy.
            #
            # Layout (set up once on the VPS, needs root):
            #   /root/prism-app/releases/<id>/     one dir per deploy (node_modules + build inside)
            #   /root/prism-app/shared/            .env / .env.local (symlinked into every release)
            #   /root/prism-app/shared/pm2-start.cjs   pm2 app entry (stable path — NOT inside a release)
            #   /root/prism-app/shared/blue-green  state file: "<active-app> <active-port>"
            #   /etc/nginx/prism-upstream.conf     nginx include: `set $prism_upstream 127.0.0.1:<port>;`
            #
            # Two pm2 apps (fork mode) run the wrapper, one release apart:
            #   prism-blue  -> 3555   prism-green -> 3556
            # The ACTIVE app serves traffic via nginx; the STANDBY app is always
            # one deploy ahead/behind. Each deploy:
            #   1. builds a fresh release dir OFF-LINE (live app untouched)
            #   2. points the STANDBY app at it (recreate; active app untouched)
            #   3. health-checks the standby port
            #   4. flips nginx to the standby port (graceful reload, zero drops)
            #   5. updates the state file
            #
            # ROLLBACK (run on the VPS, no rebuild — the other app still runs the
            # previous release):
            #   printf 'set $prism_upstream 127.0.0.1:<other-port>;\n' > /etc/nginx/prism-upstream.conf
            #   nginx -s reload
            #   echo "<other-app> <other-port>" > /root/prism-app/shared/blue-green
            #
            # If the layout is unexpectedly missing, fail loudly instead of guessing.
            if [ ! -d "$APP/releases" ]; then
              echo "ERROR: blue/green layout missing ($APP/releases not found). Run the one-time VPS setup first." >&2
              exit 1
            fi
            if [ ! -f "$APP/shared/blue-green" ]; then
              echo "ERROR: blue/green state file missing ($APP/shared/blue-green). Run the one-time VPS setup first." >&2
              exit 1
            fi

            # Standby = the app+port that is NOT currently active.
            # Tolerate both the current (prism-blue/prism-green) and legacy
            # (blue/green) spellings so an old state line still maps correctly;
            # state is always written back in the full prism-* form.
            read -r ACT_APP ACT_PORT < "$APP/shared/blue-green" || true
            case "$ACT_APP" in
              prism-blue|blue)  STD_APP=prism-green; STD_PORT=3556 ;;
              prism-green|green) STD_APP=prism-blue; STD_PORT=3555 ;;
              *) echo "ERROR: unknown active app '$ACT_APP' in state file." >&2; exit 1 ;;
            esac
            echo "active=$ACT_APP:$ACT_PORT  standby=$STD_APP:$STD_PORT"

            # <id>:<status> for a pm2 app by name (id is the reliable handle for
            # `pm2 env`, which does not accept names on all pm2 versions).
            pm2_probe() {
              STD_NAME="$1" node -e '
                const j = JSON.parse(
                  require("child_process").execSync("pm2 jlist", { encoding: "utf8" }));
                const x = j.find(v => v.name === process.env.STD_NAME);
                process.stdout.write(x ? (x.pm_id + ":" + (x.pm2_env && x.pm2_env.status)) : ":missing");
              '
            }

            # Read the release dir an app is ACTUALLY running from (ground truth,
            # not assumption). Empty if the app is gone.
            pm2_release_dir() {
              local id_="$1"
              pm2 env "$id_" 2>/dev/null | sed -n 's/^PRISM_RELEASE_DIR: //p' | head -1
            }

            REL="$APP/releases/$(date +%Y%m%d%H%M%S)-$$-${GITHUB_SHA:0:7}"

            # 1. Fetch the new code into a FRESH release dir (current release keeps serving).
            git clone --depth 1 --branch main "$REPO" "$REL"
            ln -sfn "$APP/shared/.env" "$REL/.env"
            if [ -e "$APP/shared/.env.local" ]; then
              ln -sfn "$APP/shared/.env.local" "$REL/.env.local"
            fi

            # Keep the shared wrapper current with the repo (it is infra, stable path).
            cp "$REL/scripts/pm2-start.cjs" "$APP/shared/pm2-start.cjs"
            node --check "$APP/shared/pm2-start.cjs"

            # 2. Build the new release OFF-LINE (live app untouched).
            cd "$REL"
            # Happy path uses the npm cache (fast). If npm ci fails (e.g. ENOENT chmod
            # from a CORRUPT npm cache — sharp/semver, 2026-09-02), clear the cache and
            # node_modules and retry a clean install. set -e still aborts if the retry fails.
            npm ci || { echo "npm ci failed — clearing npm cache + node_modules, retrying clean"; npm cache clean --force; rm -rf node_modules; npm ci; }
            npm run build

            # 3. Point the STANDBY app at the new release (active app untouched).
            #    Deterministic recreate: the app must be DELETED first — `pm2 start`
            #    against an app name that still exists recycles the old process and
            #    keeps its stale PRISM_RELEASE_DIR (silent no-op — the 2026-09-24
            #    drift bug). Losing the standby is fine (it serves no traffic).
            pm2 delete "$STD_APP" >/dev/null 2>&1 || true
            PRISM_RELEASE_DIR="$REL" PRISM_PORT="$STD_PORT" NODE_ENV=production \
              pm2 start "$APP/shared/pm2-start.cjs" --name "$STD_APP"

            # 3a. Assert the new standby is online AND actually running this release.
            read -r STD_ID STD_STATUS < <(pm2_probe "$STD_APP" | tr ":" " ")
            if [ -z "$STD_ID" ] || [ "$STD_STATUS" != "online" ]; then
              echo "ERROR: standby $STD_APP failed to come online (state '$STD_ID:$STD_STATUS'). Removing, production untouched." >&2
              pm2 delete "$STD_APP" >/dev/null 2>&1 || true
              exit 1
            fi
            ACTUAL_DIR=$(pm2_release_dir "$STD_ID")
            if [ "$ACTUAL_DIR" != "$REL" ]; then
              echo "ERROR: standby $STD_APP is running from '$ACTUAL_DIR', not deployment '$REL'. Removing, production untouched." >&2
              pm2 delete "$STD_APP" >/dev/null 2>&1 || true
              exit 1
            fi

            # 4. Health-check the standby BEFORE flipping traffic to it. Check both
            #    the root route (SSR) and a middleware-covered route (catches the
            #    MODULE_NOT_FOUND lazy-require class of 500s). Refuse 000/5xx.
            ok=""
            for i in $(seq 1 120); do
              c=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "http://localhost:$STD_PORT/" 2>/dev/null || true)
              [ "$c" = "200" ] && ok=1 && break
              sleep 1
            done
            d=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "http://localhost:$STD_PORT/dashboard" 2>/dev/null || true)
            case "$d" in 2*|3*) ;; *) echo "ERROR: standby middleware route returned '$d' (want 2xx/3xx)." >&2; ok="" ;; esac
            if [ -z "$ok" ]; then
              echo "ERROR: standby $STD_APP unhealthy on $STD_PORT (root=$c dashboard=$d). Removing, production untouched." >&2
              pm2 delete "$STD_APP" >/dev/null 2>&1 || true
              exit 1
            fi

            # 5. Flip nginx to the standby port (graceful reload, zero drops).
            printf 'set $prism_upstream 127.0.0.1:%s;\n' "$STD_PORT" > /etc/nginx/prism-upstream.conf
            nginx -t
            nginx -s reload
            sleep 1
            ok=""
            for i in $(seq 1 30); do
              c=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "http://localhost/" 2>/dev/null || true)
              [ "$c" = "200" ] && ok=1 && break
              sleep 1
            done
            if [ -z "$ok" ]; then
              # Flip back to the previous active app and leave it serving.
              echo "ERROR: public health check failed after flip (last: $c). Rolling back upstream." >&2
              printf 'set $prism_upstream 127.0.0.1:%s;\n' "$ACT_PORT" > /etc/nginx/prism-upstream.conf
              nginx -t && nginx -s reload || true
              exit 1
            fi

            # 5a. Post-flip: the new active app must still be the one we deployed.
            read -r ACT_ID ACT_STATUS < <(pm2_probe "$STD_APP" | tr ":" " ")
            ACTUAL_DIR=$(pm2_release_dir "$ACT_ID")
            if [ "$ACT_STATUS" != "online" ] || [ "$ACTUAL_DIR" != "$REL" ]; then
              echo "ERROR: active $STD_APP drifted from deployment after flip (status=$ACT_STATUS dir=$ACTUAL_DIR). Investigate - NOT exiting clean." >&2
            fi

            # 6. Record the new active app+port, then prune old releases.
            echo "$STD_APP $STD_PORT" > "$APP/shared/blue-green"
            pm2 save > /dev/null

            # Keep the last 5 releases for instant rollback, but NEVER delete a
            # release a running app still uses (a deployed-then-pruned dir kills
            # lazy requires -> intermittent 500s; the 2026-09-24 outage). legacy/
            # is also off-limits.
            USED=""
            for a in prism-blue prism-green; do
              i=$(pm2_probe "$a" | cut -d: -f1)
              [ -n "$i" ] && USED="$USED $(pm2_release_dir "$i")"
            done
            ls -1dt "$APP"/releases/*/ | grep -vE '/legacy/$' | tail -n +6 | while read -r dir; do
              skip=""
              for u in $USED; do [ "$dir" = "$u" ] && skip=1; done
              if [ -z "$skip" ]; then rm -rf "$dir"; echo "pruned $dir"; else echo "kept in-use $dir"; fi
            done