name: "Schema drift check"

# Guards against the model<->DB drift that let a `db-push --force` recreate a
# drifted table and wipe data_entries (2026-09-04). Runs on every PR: introspects
# LIVE p2's information_schema (READ-ONLY) and diffs it against the Drizzle model.
#
# Needs a READ-ONLY DB connection string in the repo secret DATABASE_URL_READONLY
# (least privilege — the check only SELECTs from information_schema). Until that
# secret is set, the script exits 2 (no creds) and this job WARNS but does not block.
#
# Exit codes (from scripts/schema-drift-check.ts):
#   0 = in sync            -> pass
#   1 = real drift         -> FAIL the PR (reconcile first; owner: #2 migration)
#   2 = couldn't run       -> WARN only, never block (no creds / p2 unreachable)
on:
  pull_request:
    branches: ["main"]

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Schema drift check (read-only vs live p2)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_READONLY }}
        run: |
          set +e
          npm run drift-check -- --github   # emits ::error:: per drift + ::warning:: for skip/DB-only cols, inline on the PR
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::Schema drift between the Drizzle model and live p2 — reconcile before merging (owner: #2 migration). Run 'npm run drift-check' locally for the diff."
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::drift-check could not run (no DB creds or p2 unreachable) — NOT blocking this PR."
            exit 0
          else
            echo "Schema in sync with live p2."
            exit 0
          fi
