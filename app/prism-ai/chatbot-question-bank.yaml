# PRISM Chatbot Question Bank - machine-consumable form.
# Keep in sync with chatbot-question-bank.txt.
#
# Schema (one entry per intent):
#   id:          stable identifier
#   family:      grouping (matches a section in the .txt file)
#   canonical:   preferred phrasing
#   aliases:     paraphrases that resolve to this intent
#   personas:    [utility, donor, regulator, admin, external]
#   params:
#     required:  parameter ids that must be resolved before answering
#     optional:  parameter ids that refine the answer
#   capability:  one of the ChatbotCapabilityName values in lib/chatbot/types.ts
#   output:      default ChatbotRecommendedView
#   guardrails:  free-text rules the answer must obey
#
# Capability values (see lib/chatbot/types.ts):
#   report-period-overview, anomaly-insights, performance-snapshot,
#   scorecard-snapshot, review-kpi-diagnostics, benchmarking-snapshot,
#   trend-snapshot, governance-audit-snapshot, configuration-setup-snapshot,
#   input-value-lookup, visual-presentation-hints

version: 1
default_personas: [utility, donor, regulator, admin, external]

parameters:
  utility: { type: ref, description: "single utility" }
  utilities: { type: "ref[]", description: "peer group / country / region" }
  kpi: { type: ref, description: "single KPI definition" }
  kpis: { type: "ref[]", description: "set of KPIs" }
  service_area: { type: ref, description: "single service area" }
  period: { type: period, description: "single report period" }
  previous_period: { type: period, description: "immediately preceding period" }
  period_a: { type: period }
  period_b: { type: period }
  scope: { type: enum, values: [utility, country, region, peer_group] }
  audience:
    {
      type: enum,
      values:
        [
          board,
          ministerial,
          donor,
          regulator,
          public,
          media,
          partner,
          ops_manager,
          ceo,
        ],
    }
  chart_type:
    {
      type: enum,
      values:
        [
          table,
          bar,
          line,
          trend,
          leaderboard,
          heatmap,
          radar,
          scatter,
          dashboard,
        ],
    }
  status:
    {
      type: enum,
      values:
        [
          calculated,
          stale,
          missing_input,
          error,
          awaiting_review,
          not_approved,
          on_track,
          at_risk,
          off_track,
        ],
    }
  exclusion_code:
    {
      type: enum,
      values:
        [
          MISSING_TARGET,
          MISSING_ACTUAL,
          INVALID_RANGE,
          NOT_APPROVED,
          DUPLICATE_SUPERSEDED,
        ],
    }
  n: { type: int }
  x: { type: number, description: "percent magnitude in what-if" }
  goal:
    {
      type: enum,
      values:
        [
          completeness,
          scorecard_score,
          reliability,
          financial,
          customer,
          asset,
        ],
    }
  issue: { type: ref }

intents:
  # --- 1. Onboarding & navigation ---------------------------------------
  - id: ONB-WHATCANIDO
    family: onboarding
    canonical: "What can I do in PRISM with my role?"
    aliases:
      - "What can I do as a utility user?"
      - "What can I do as a donor?"
      - "What can I do as a regulator?"
    personas: [utility, donor, regulator, admin]
    capability: configuration-setup-snapshot
    output: text

  - id: ONB-WHEREDOISTART
    family: onboarding
    canonical: "Where do I start for this reporting cycle?"
    aliases: ["What should I do first this period?"]
    personas: [utility]
    capability: report-period-overview
    output: text

  - id: ONB-PAGEPURPOSE
    family: onboarding
    canonical:
      "What is the difference between Enter Data, Review KPI, and Balanced
      Scorecard?"
    personas: [utility]
    capability: configuration-setup-snapshot
    output: text

  - id: ONB-WHEREISFEATURE
    family: onboarding
    canonical: "Where do I {feature}?"
    aliases:
      - "Where do I approve a custom KPI?"
      - "Where do I export this table?"
      - "How do I change my filters?"
    personas: [utility, admin]
    capability: configuration-setup-snapshot
    output: text

  - id: ONB-MYSCOPE
    family: onboarding
    canonical: "What can my role see, and why can't I see {scope}?"
    personas: [utility, donor, regulator, admin, external]
    capability: configuration-setup-snapshot
    output: text
    guardrails:
      - "Never disclose data outside the requester's authorised scope while
        explaining."

  # --- 2. Data submission & completeness --------------------------------
  - id: DAT-MISSING
    family: data-submission
    canonical: "What inputs are missing for {utility} in {period}?"
    aliases:
      - "Which inputs are incomplete for my utility?"
      - "Which service areas still have missing entries?"
      - "Which KPI categories are least complete?"
      - "How complete is our data submission overall?"
      - "What percentage of required inputs have been submitted?"
      - "Which report period has the biggest data gap?"
    personas: [utility, admin]
    params:
      required: [utility, period]
      optional: [service_area]
    capability: report-period-overview
    output: table

  - id: DAT-RECENT
    family: data-submission
    canonical: "Which data-entry rows changed most recently for {utility}?"
    aliases:
      - "Who last updated this input?"
      - "When was this input last changed?"
    personas: [utility, admin]
    params: { required: [utility], optional: [period, service_area] }
    capability: governance-audit-snapshot
    output: table

  - id: DAT-NOTAVAILABLE
    family: data-submission
    canonical: 'Which values are marked "data not available"?'
    personas: [utility, admin]
    params: { required: [utility, period] }
    capability: report-period-overview
    output: table

  - id: DAT-OVERDUE
    family: data-submission
    canonical: "Which input fields are overdue for {period}?"
    personas: [utility, admin, regulator]
    params: { required: [period], optional: [utility] }
    capability: report-period-overview
    output: table

  - id: DAT-NEEDS-COMMENT
    family: data-submission
    canonical: "Which records still need comments or clarification?"
    personas: [utility]
    params: { required: [utility, period] }
    capability: review-kpi-diagnostics
    output: table

  - id: DAT-DRAFT-VS-SUBMIT
    family: data-submission
    canonical:
      "What is the difference between a saved draft and a submitted entry, and
      how do I finalise?"
    personas: [utility]
    capability: configuration-setup-snapshot
    output: text

  - id: DAT-PERIOD-STATE
    family: data-submission
    canonical: "Is {period} open or closed for entry? When does it close?"
    personas: [utility, admin]
    params: { required: [period] }
    capability: report-period-overview
    output: text

  - id: DAT-INPUT-CONTROL
    family: data-submission
    canonical: "What input type does this field expect?"
    aliases: ["Is this a number, percent, currency, dropdown, or managed list?"]
    personas: [utility]
    capability: configuration-setup-snapshot
    output: text

  # --- 3. Validation & data quality -------------------------------------
  - id: DQ-SUSPICIOUS
    family: data-quality
    canonical:
      "Which submitted values look inconsistent or out of range for {utility}?"
    aliases:
      - "Which values are outside normal ranges?"
      - "Which inputs are causing data-quality issues?"
    personas: [utility, regulator, admin]
    params: { required: [utility], optional: [period] }
    capability: anomaly-insights
    output: table

  - id: DQ-FAILED-VALIDATION
    family: data-quality
    canonical: "Which data points failed validation, and why?"
    personas: [utility, admin]
    params: { required: [utility, period] }
    capability: review-kpi-diagnostics
    output: table

  - id: DQ-DUPLICATES
    family: data-quality
    canonical: "Which entries look like duplicates or have been superseded?"
    personas: [utility, admin]
    params: { required: [utility, period] }
    capability: review-kpi-diagnostics
    output: table

  - id: DQ-TOP-ISSUES
    family: data-quality
    canonical: "What are the top data-quality issues to fix first?"
    personas: [utility, admin]
    params: { required: [utility, period] }
    capability: review-kpi-diagnostics
    output: table

  - id: DQ-BLOCKING-KPIS
    family: data-quality
    canonical: "Which KPIs are blocked because of bad source data?"
    personas: [utility, admin]
    params: { required: [utility, period] }
    capability: review-kpi-diagnostics
    output: table

  # --- 4. KPI status & review -------------------------------------------
  - id: KPI-STATUS
    family: kpi-status
    canonical: "What is the current status of {kpi} for {utility} in {period}?"
    aliases:
      - "Which KPIs are calculated for my utility right now?"
      - "Which KPIs are stale?"
      - "Which KPIs have missing inputs?"
      - "Which KPIs have errors?"
      - "Which KPIs are waiting for review?"
    personas: [utility, regulator, admin]
    params: { required: [utility, period], optional: [kpi, status] }
    capability: review-kpi-diagnostics
    output: table

  - id: KPI-WHY-STATUS
    family: kpi-status
    canonical: "Why is {kpi} marked {status}?"
    aliases:
      - "Why is this KPI stale?"
      - "Why is this KPI missing input?"
      - "Why did this KPI calculation fail?"
    personas: [utility, admin]
    params: { required: [kpi, status, utility, period] }
    capability: review-kpi-diagnostics
    output: text

  - id: KPI-FORMULA
    family: kpi-status
    canonical: "What is the formula for {kpi}, and which inputs feed it?"
    personas: [utility, admin, regulator]
    params: { required: [kpi] }
    capability: configuration-setup-snapshot
    output: text

  - id: KPI-COMMENTS
    family: kpi-status
    canonical: "Which review comments exist on {kpi}, and which are unresolved?"
    personas: [utility, admin]
    params: { required: [kpi, utility, period] }
    capability: review-kpi-diagnostics
    output: table
    guardrails:
      ["Do not expose utility-private comments to donor or external personas."]

  - id: KPI-WORST
    family: kpi-status
    canonical: "Which KPIs are most problematic this period for {utility}?"
    personas: [utility, regulator]
    params: { required: [utility, period] }
    capability: performance-snapshot
    output: leaderboard

  - id: KPI-RECALC
    family: kpi-status
    canonical:
      "How do I trigger a recalculation, and when was the kpi-worker last run?"
    personas: [utility, admin]
    capability: governance-audit-snapshot
    output: text

  # --- 5. Targets, trends, performance ----------------------------------
  - id: PERF-VS-TARGET
    family: performance
    canonical: "What is the actual versus target for {kpi}?"
    personas: [utility, regulator, donor]
    params: { required: [kpi], optional: [utility, period] }
    capability: performance-snapshot
    output: bar-chart

  - id: PERF-TRACK
    family: performance
    canonical: "Which KPIs are on-track / at-risk / off-track?"
    personas: [utility, regulator, donor]
    params: { required: [utility, period] }
    capability: performance-snapshot
    output: heatmap

  - id: PERF-CHANGE
    family: performance
    canonical: "Which KPIs improved or worsened versus {previous_period}?"
    aliases:
      - "Which KPIs have the strongest positive trend?"
      - "Which KPIs have the weakest trend?"
      - "What are the biggest movers?"
    personas: [utility, regulator, donor]
    params: { required: [utility, previous_period] }
    capability: trend-snapshot
    output: leaderboard

  - id: PERF-COMPARE-PERIOD
    family: performance
    canonical: "Compare {scope} between {period_a} and {period_b}."
    personas: [utility, regulator, donor]
    params: { required: [scope, period_a, period_b] }
    capability: trend-snapshot
    output: line-chart

  - id: PERF-COMPARE-PEERS
    family: performance
    canonical: "Compare {utility} against peers / regional median."
    personas: [utility, regulator, donor]
    params: { required: [utility], optional: [kpi, period] }
    capability: benchmarking-snapshot
    output: bar-chart

  - id: PERF-SUMMARY
    family: performance
    canonical: "Summarise {utility}'s KPI performance for {period}."
    personas: [utility, regulator]
    params: { required: [utility, period] }
    capability: performance-snapshot
    output: dashboard

  - id: PERF-URGENT
    family: performance
    canonical: "Which KPIs need urgent management attention?"
    personas: [utility, regulator]
    params: { required: [utility, period] }
    capability: performance-snapshot
    output: leaderboard

  # --- 6. Balanced scorecard --------------------------------------------
  - id: BSC-SCORE
    family: scorecard
    canonical: "What is {utility}'s balanced scorecard score for {period}?"
    personas: [utility, regulator, donor]
    params: { required: [utility, period] }
    capability: scorecard-snapshot
    output: dashboard

  - id: BSC-METHOD
    family: scorecard
    canonical: "How is the balanced scorecard calculated?"
    personas: [utility, regulator, donor, external]
    capability: configuration-setup-snapshot
    output: text

  - id: BSC-BY-PERSPECTIVE
    family: scorecard
    canonical: "Show scorecard score by perspective; which is weakest?"
    personas: [utility, regulator]
    params: { required: [utility, period] }
    capability: scorecard-snapshot
    output: radar

  - id: BSC-DRIVER
    family: scorecard
    canonical:
      "Which objective / initiative / KPI contributes most to poor scorecard
      performance?"
    personas: [utility, regulator]
    params: { required: [utility, period] }
    capability: scorecard-snapshot
    output: leaderboard

  - id: BSC-EXCLUSIONS
    family: scorecard
    canonical: "Which KPIs are excluded from the scorecard, and why?"
    personas: [utility, regulator, admin]
    params: { required: [utility, period] }
    capability: scorecard-snapshot
    output: table

  - id: BSC-EXCLUSION-CODE
    family: scorecard
    canonical: "What does {exclusion_code} mean?"
    personas: [utility, regulator, admin, external]
    params: { required: [exclusion_code] }
    capability: configuration-setup-snapshot
    output: text

  # --- 7. Custom KPI workflow -------------------------------------------
  - id: CKPI-REQUEST
    family: custom-kpi
    canonical: "How do I request a custom KPI?"
    personas: [utility]
    capability: configuration-setup-snapshot
    output: text

  - id: CKPI-MY-STATUS
    family: custom-kpi
    canonical: "What is the status of my custom KPI request(s)?"
    aliases:
      [
        "Has my custom KPI been approved?",
        "Has my custom KPI been promoted into the KPI library?",
      ]
    personas: [utility]
    capability: review-kpi-diagnostics
    output: table

  - id: CKPI-WHY-REJECTED
    family: custom-kpi
    canonical: "Why was my custom KPI request rejected?"
    personas: [utility]
    capability: review-kpi-diagnostics
    output: text

  - id: CKPI-PENDING-REVIEW
    family: custom-kpi
    canonical: "Which custom KPI requests are awaiting my review?"
    personas: [utility, admin]
    capability: review-kpi-diagnostics
    output: table

  - id: CKPI-PROMOTE
    family: custom-kpi
    canonical: "How is a custom KPI promoted into the KPI library?"
    personas: [utility, admin]
    capability: configuration-setup-snapshot
    output: text

  - id: CKPI-NOTIFY
    family: custom-kpi
    canonical: "When am I notified about custom KPI status changes?"
    personas: [utility]
    capability: configuration-setup-snapshot
    output: text

  # --- 8. Domain themes (parameterised) ---------------------------------
  - id: THM-RELIABILITY
    family: domain-theme
    canonical:
      "Which utilities or service areas show weak reliability in {scope}?"
    aliases:
      - "Which service areas had the worst reliability this period?"
      - "Where are outages increasing fastest?"
      - "Which areas show deteriorating restoration performance?"
      - "Which service areas have the highest technical losses?"
    personas: [utility, regulator, donor]
    params: { required: [scope], optional: [period] }
    capability: performance-snapshot
    output: leaderboard

  - id: THM-FINANCIAL
    family: domain-theme
    canonical:
      "Which utilities or service areas show weak financial performance in
      {scope}?"
    aliases:
      - "Which KPIs show the biggest revenue-collection problems?"
      - "Where are operating costs rising fastest?"
      - "Which service areas have poor cost recovery?"
      - "Which indicators suggest billing or collections risk?"
    personas: [utility, regulator, donor, external]
    params: { required: [scope], optional: [period] }
    capability: performance-snapshot
    output: leaderboard

  - id: THM-CUSTOMER
    family: domain-theme
    canonical:
      "Which utilities or service areas show weakening customer-service
      performance in {scope}?"
    aliases:
      - "Where are complaints or service delays getting worse?"
      - "Which areas have the biggest gap between service quality and target?"
    personas: [utility, regulator, donor, external]
    params: { required: [scope], optional: [period] }
    capability: performance-snapshot
    output: leaderboard

  - id: THM-ASSET
    family: domain-theme
    canonical:
      "Which KPIs suggest underinvestment or maintenance backlog in {scope}?"
    aliases:
      - "Which service areas may need capital upgrades first?"
      - "What asset-related KPIs are worsening over time?"
    personas: [utility, regulator, donor]
    params: { required: [scope], optional: [period] }
    capability: trend-snapshot
    output: leaderboard

  - id: THM-RESILIENCE
    family: domain-theme
    canonical: "Which utilities are least resilient to operational shocks?"
    aliases:
      - "Which utilities show deteriorating reliability trends over multiple
        periods?"
      - "Which utilities show signs of infrastructure stress?"
    personas: [regulator, donor]
    params: { optional: [period] }
    capability: trend-snapshot
    output: leaderboard

  # --- 9. Benchmarking --------------------------------------------------
  - id: BMK-RANK
    family: benchmarking
    canonical: "Rank utilities by {kpi} or scorecard score."
    personas: [donor, regulator, utility]
    params: { required: [], optional: [kpi, period] }
    capability: benchmarking-snapshot
    output: leaderboard

  - id: BMK-PEER-GROUP
    family: benchmarking
    canonical: "What is the right peer group for {utility}, and why?"
    personas: [donor, regulator, utility]
    params: { required: [utility] }
    capability: benchmarking-snapshot
    output: text

  - id: BMK-MEDIAN
    family: benchmarking
    canonical:
      "Which utilities are above or below the regional median for {kpi}?"
    personas: [donor, regulator]
    params: { required: [kpi], optional: [period] }
    capability: benchmarking-snapshot
    output: bar-chart

  - id: BMK-OUTLIERS
    family: benchmarking
    canonical: "Which utilities are outliers for {kpi}?"
    personas: [donor, regulator]
    params: { required: [kpi], optional: [period] }
    capability: anomaly-insights
    output: scatter

  - id: BMK-COUNTRY
    family: benchmarking
    canonical:
      "Which countries or subregions are improving fastest, and which are
      lagging?"
    personas: [donor, regulator, external]
    params: { optional: [period] }
    capability: benchmarking-snapshot
    output: heatmap

  - id: BMK-METHOD
    family: benchmarking
    canonical:
      "Is this benchmark median, average, or best performer? Which method is
      fairest here?"
    personas: [donor, regulator]
    capability: configuration-setup-snapshot
    output: text

  # --- 10. Risk, compliance, escalation ---------------------------------
  - id: RISK-THRESHOLD
    family: risk
    canonical: "Which utilities are below required thresholds on {kpi}?"
    personas: [regulator, donor]
    params: { required: [kpi], optional: [period] }
    capability: performance-snapshot
    output: table

  - id: RISK-PERSISTENT
    family: risk
    canonical:
      "Which utilities are consistently underperforming across multiple periods?"
    personas: [regulator, donor]
    params: { optional: [kpi] }
    capability: trend-snapshot
    output: leaderboard

  - id: RISK-COMPLIANCE
    family: risk
    canonical:
      "Which utilities have poor reporting compliance (late, incomplete, or
      repeated missing data)?"
    personas: [regulator, donor, admin]
    params: { optional: [period] }
    capability: governance-audit-snapshot
    output: table

  - id: RISK-POST-ACTION
    family: risk
    canonical:
      "Which utilities improved or failed to improve after prior intervention?"
    personas: [regulator, donor]
    capability: trend-snapshot
    output: leaderboard

  - id: RISK-ESCALATE
    family: risk
    canonical:
      "Which utilities should escalate from monitoring to enforcement this
      period?"
    personas: [regulator]
    params: { required: [period] }
    capability: performance-snapshot
    output: table

  - id: RISK-COMBINED
    family: risk
    canonical:
      "Which utilities combine weak finance, weak service, and weak data
      quality?"
    personas: [regulator, donor]
    params: { optional: [period] }
    capability: performance-snapshot
    output: table

  # --- 11. Root-cause & dependencies ------------------------------------
  - id: RCA-DRIVERS
    family: root-cause
    canonical: "What likely explains the deterioration in {kpi}?"
    personas: [utility, regulator]
    params: { required: [kpi, utility], optional: [period] }
    capability: review-kpi-diagnostics
    output: text

  - id: RCA-RELATED
    family: root-cause
    canonical: "Which related KPIs are moving together with {kpi}?"
    personas: [utility, regulator]
    params: { required: [kpi, utility] }
    capability: trend-snapshot
    output: line-chart

  - id: RCA-SCOPE
    family: root-cause
    canonical: "Is this problem isolated to {utility} or system-wide?"
    personas: [utility, regulator, donor]
    params: { required: [utility, kpi] }
    capability: benchmarking-snapshot
    output: bar-chart

  - id: DEP-INPUTS
    family: dependencies
    canonical: "Which inputs feed {kpi}?"
    personas: [utility, admin]
    params: { required: [kpi] }
    capability: configuration-setup-snapshot
    output: table

  - id: DEP-DOWNSTREAM
    family: dependencies
    canonical: "Which scorecard results or KPIs depend on {input_or_kpi}?"
    personas: [utility, admin]
    params: { required: [issue] }
    capability: configuration-setup-snapshot
    output: sankey

  # --- 12. Forecasting & scenario ---------------------------------------
  - id: SCN-PROJECT
    family: scenario
    canonical: "If current trends continue, which KPIs miss target next period?"
    personas: [utility, regulator]
    params: { required: [utility] }
    capability: trend-snapshot
    output: table

  - id: SCN-WHATIF
    family: scenario
    canonical: "If {kpi} improved by {x}%, what is the scorecard impact?"
    personas: [utility, regulator]
    params: { required: [kpi, x, utility] }
    capability: scorecard-snapshot
    output: bar-chart

  - id: SCN-FILL-GAPS
    family: scenario
    canonical:
      "If missing inputs are completed, which results are most likely to change?"
    personas: [utility]
    params: { required: [utility, period] }
    capability: review-kpi-diagnostics
    output: table

  - id: SCN-BIGGEST-LEVER
    family: scenario
    canonical: "Which improvement would have the biggest downstream impact?"
    personas: [utility, regulator]
    params: { required: [utility] }
    capability: scorecard-snapshot
    output: leaderboard

  # --- 13. Action planning ----------------------------------------------
  - id: ACT-NEXT
    family: action
    canonical: "What should I do next to improve {goal}?"
    personas: [utility]
    params: { required: [goal] }
    capability: review-kpi-diagnostics
    output: text

  - id: ACT-PRIORITISE
    family: action
    canonical: "If I can only address three issues, which should I prioritise?"
    personas: [utility, regulator]
    params: { required: [utility] }
    capability: performance-snapshot
    output: table

  - id: ACT-OWNERSHIP
    family: action
    canonical: "Which team should own fixing {issue}? Who acts next?"
    personas: [utility]
    params: { required: [issue] }
    capability: governance-audit-snapshot
    output: text

  - id: ACT-QUICK-WINS
    family: action
    canonical: "Which weak KPIs can be improved quickly?"
    personas: [utility, regulator]
    params: { required: [utility] }
    capability: performance-snapshot
    output: table

  - id: ACT-AUDIENCE
    family: action
    canonical: "What should a {audience} focus on here?"
    personas: [utility, regulator, donor, external]
    params: { required: [audience] }
    capability: visual-presentation-hints
    output: text

  # --- 14. Confidence, evidence, governance -----------------------------
  - id: EVID-CONFIDENCE
    family: evidence
    canonical: "How reliable is this result given missing or weak inputs?"
    personas: [utility, regulator, donor, external]
    capability: review-kpi-diagnostics
    output: text

  - id: EVID-CAVEATS
    family: evidence
    canonical: "What caveats should I include when presenting this?"
    personas: [utility, regulator, donor, external]
    capability: visual-presentation-hints
    output: text

  - id: EVID-PROVENANCE
    family: evidence
    canonical:
