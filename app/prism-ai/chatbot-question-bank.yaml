      "Is our Annual Report audited / completed within four months in {period}?"
    aliases:
      - "Has a Strategic Plan been adopted / implemented in {period}?"
      - "Is the CEO on a Performance Contract in {period}? Does it include
        annual reviews?"
      - "Is a Code of Conduct in place / implemented in {period}?"
      - "Is a Commercial Mandate in place / implemented in {period}?"
      - "Are Ministers (or line/sector Ministers) appointed to the Board in
        {period}?"
      - "Does the Annual Report disclose performance relative to the Strategic
        Plan in {period}?"
      - "Does the Strategic Plan include three or more years of forecasts in
        {period}?"
    personas: [utility, regulator, donor, board]
    params:
      required: [period]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "These are boolean KPIs in 'Governance' (subcategories: Annual Reports,
        Strategic Plans, Performance Culture, Code of Conduct, Commercial Focus,
        Government Involvement). Render Yes/No, not true/false."
      - "Cite the report period and the exact KPI name."

  - id: VAL-COST-RATIOS
    family: value-lookup
    canonical:
      "What is our cost-of-sales ratio / O&M cost ratio / staff cost ratio in
      {period}?"
    aliases:
      - "Cost Breakdown KPIs (ratios derived from O&M, Staff, Apportioned and
        Power Purchase costs) in {period}."
      - "Show the Cost Breakdown KPI values for {period}."
    personas: [utility, donor, regulator]
    params:
      required: [period]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "These are 9 calculated KPIs in 'Financial → Cost Breakdown'. They are
        derived from the underlying O&M / Staff / Apportioned / Power Purchase
        cost inputs."
      - "If a KPI value is missing, do NOT recompute it from inputs — just
        report it as not yet calculated."

  - id: VAL-APPORTIONED-COSTS
    family: value-lookup
    canonical: "What are our apportioned costs by function in {period}?"
    aliases:
      - "Apportioned Cost: Executive Mgt & Admin / Finance & Procurement / HR &
        Safety / ICT / Customer Services Marketing & PR / Other Staff / Duty and
        Taxes (Fuel & Oil, Others) in {period}."
    personas: [utility, donor, regulator]
    params:
      required: [period]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "Use the 'Apportioned Cost: …' input definitions in 'Financial → Cost
        Breakdown'. Show one row per function; only sum if asked."

  - id: VAL-FTE-AND-STAFF-UTILIZATION
    family: value-lookup
    canonical:
      "How many FTE employees do we have in distribution / generation /
      transmission for {period}?"
    aliases:
      - "FTE Employees in Distribution / Generation / Transmission for {period}."
      - "Staff utilization breakdown for {period}."
    personas: [utility, regulator, donor]
    params:
      required: [period]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "Use 'FTE Employees in …' inputs (HR & Safety → FTE Employees) and the
        'Staff Utilization' inputs. Cite the period."

  - id: VAL-SAFETY
    family: value-lookup
    canonical: "How many lost-time / total injuries did we record in {period}?"
    aliases:
      - "Safety incidents / lost-time injuries / total injuries in {period}."
      - "Show the safety inputs for {period}."
    personas: [utility, regulator, donor]
    params:
      required: [period]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "Use the inputs in 'HR & Safety → Safety'. Cite the period and the exact
        input name."

  - id: VAL-FX-RATE
    family: value-lookup
    canonical: "What was the USD exchange rate in {period}?"
    aliases:
      - "Exchange rate to USD in {period}."
      - "Foreign exchange rate for {period}."
    personas: [utility, donor, regulator]
    params:
      required: [period]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "Use the input in 'Financial → Foreign Exchange'. Cite the period and
        the unit."

  # ----- Calculation / aggregation patterns -----------------------------
  # The input-value-lookup capability now performs server-side
  # sum/avg/min/max/count/diff/percent_change when the question contains
  # the relevant verbs. The LLM must prefer the server-side aggregations
  # over re-doing arithmetic in its head.

  - id: CALC-SUM
    family: value-lookup
    canonical: "What is the total {input} across {dimension} in {period}?"
    aliases:
      - "Sum of {input} for {period}."
      - "Combined {input} across all {dimension}."
      - "Add up the {input} values for {period}."
    personas: [utility, regulator, donor]
    params:
      required: [period]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "Use the server-side 'sum(N rows)' aggregation from the grounding block.
        Show the row breakdown first, then the sum."
      - "Booleans and managed-list KPIs are intentionally excluded from sums."

  - id: CALC-AVERAGE
    family: value-lookup
    canonical: "What is the average {input} in {period}?"
    aliases:
      - "Mean / typical / avg {input} for {period}."
      - "Average {input} per {dimension}."
    personas: [utility, regulator, donor]
    params:
      required: [period]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "Use the server-side 'average(N rows)' value. State the row count used
        in the denominator."

  - id: CALC-MIN-MAX
    family: value-lookup
    canonical: "What was the highest / lowest {input} in {period}?"
    aliases:
      - "Maximum / peak {input} in {period}."
      - "Minimum / smallest {input} for {period}."
    personas: [utility, regulator, donor]
    params:
      required: [period]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "Use the server-side 'min' and 'max' values. Identify the row(s) the
        extremum came from."

  - id: CALC-DIFFERENCE
    family: value-lookup
    canonical:
      "What is the difference in {input} between {year_a} and {year_b}?"
    aliases:
      - "{input} change from {year_a} to {year_b}."
      - "{input} {year_b} vs {year_a}."
      - "Year-over-year change in {input}."
      - "How much did {input} grow / fall from {year_a} to {year_b}?"
    personas: [utility, regulator, donor, board]
    params:
      required: [period_a, period_b]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "Use the server-side 'difference(yearB − yearA)' value. Include the
        per-year subtotals in parentheses."
      - "If either year is missing data, say so explicitly — do not impute."

  - id: CALC-PERCENT-CHANGE
    family: value-lookup
    canonical:
      "What is the % change / growth rate in {input} from {year_a} to {year_b}?"
    aliases:
      - "{input} growth rate {year_a} → {year_b}."
      - "Percentage increase / decrease in {input} year over year."
    personas: [utility, regulator, donor, board]
    params:
      required: [period_a, period_b]
      optional: [utility]
    capability: input-value-lookup
    output: table
    guardrails:
      - "Use the server-side 'percent_change(yearB vs yearA)' value. If the base
        year is 0 the result is undefined — do not invent one."

# ----------------------------------------------------------------------
# Out-of-scope / refusal patterns. The chatbot must refuse or redirect.
# ----------------------------------------------------------------------
refusals:
  - id: REF-PRIVATE-COMMENTS
    pattern: "Show another utility's private review comments."
    when_persona_in: [utility, donor, regulator, external]
    response:
      "I can only share review comments for utilities you are authorised to
      view."

  - id: REF-PII
    pattern: "Show personal data (email, phone, address) of other users."
    when_persona_in: [utility, donor, regulator, external]
    response: "I can't share personal contact information for other users."

  - id: REF-ADVICE
    pattern: "Give tariff, investment, or legal advice as if authoritative."
    response:
      "I can summarise the data and trends but can't give tariff, investment, or
      legal advice."

  - id: REF-BLAME
    pattern: "Speculate about individuals' performance or attribute blame."
    response:
      "I can describe what the data shows but won't attribute outcomes to named
      individuals."

  - id: REF-BULK-EXPORT
    pattern: "Export bulk data outside the user's authorised scope."
    response:
      "Bulk exports are restricted to data within your authorised scope."

  - id: REF-DRAFT-EXTERNAL
    pattern:
      "Generate external content from draft / unapproved values without caveat."
    response:
      "These values are still in draft. I'll only include them with an explicit
      data-quality caveat."

# ----------------------------------------------------------------------
# Multi-turn / follow-up patterns. Resolved against the prior turn.
# ----------------------------------------------------------------------
followups:
  - pattern: "...and now break that down by service area."
    action: re_run_with_dimension
    dimension: service_area

  - pattern: "Same thing but for {previous_period|last year}."
    action: re_run_with_period
    bind: previous_period

  - pattern: "Just the bottom five."
    action: limit
    direction: bottom
    n: 5

  - pattern: "Show that as a {chart_type}."
    action: re_render
    bind: chart_type

  - pattern: "Why?"
    action: explain_last_result

  - pattern: "Compare with {peer|utility}."
    action: re_run_with_peer
    bind: utility

  - pattern: "Drill into {row}."
    action: drill_in
    bind: issue

  - pattern: "Export that."
    action: export_last_result
    guardrails: ["Apply REF-BULK-EXPORT scope check."]
